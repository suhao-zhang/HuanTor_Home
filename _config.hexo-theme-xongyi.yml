# ============================================================
#  站点级主题配置覆盖（Hexo 会与主题默认配置深度合并）
#  只在这里写你要改的键；升级主题不会丢这份配置
#  完整可覆盖项见 themes/hexo-theme-xongyi/_config.yml
# ============================================================

preset: enterprise          # enterprise 商务蓝 / government 政务红 / education 学院青

# ------------------------------------------------------------
# 品牌
# ------------------------------------------------------------
brand:
  name: "新乡洹拓科技"          # logo 图里已含"洹拓科技"字样，这段文字由 site.css 视觉隐藏，
                                # 仍保留给 alt / aria-label / SEO 用
  slogan: "AI 大模型研发 · 工业智能 · SaaS 与云服务"
  logo: "/images/logo-light.png"   # 亮色版；暗色模式下 site.js 自动换成 logo-dark.png
  favicon: "/images/favicon.png"   # 从 logo 图形部分裁出来的 128x128 图标

# ------------------------------------------------------------
# 导航
# ------------------------------------------------------------
menu:
  - { name: "首页", url: "/" }
  - { name: "关于我们", url: "/about/" }
  - { name: "产品服务", url: "/products/" }
  - { name: "新闻动态", url: "/news/" }
  - { name: "技术栈", url: "/tech/" }
  - { name: "联系我们", url: "/contact/" }

nav_button:
  name: "技术咨询"
  url: "/contact/"

# ------------------------------------------------------------
# 首页板块开关
# 注意：Hexo 对配置里的数组是"按下标深合并"，在覆盖文件里重写 sections
# 只能改内容和追加，删不掉主题默认的条目。要隐藏板块请用 enable: false
# （主题 index.ejs 里 conf.enable === false 会跳过该板块）。
# stats 数据、team 团队、partners 伙伴、gallery 图库需要真实数字和照片，先关掉。
# 生效顺序：hero → quicklinks → services → products → news → cta → about-contact
# ------------------------------------------------------------
stats:
  enable: false

team:
  enable: false

partners:
  enable: false

gallery:
  enable: false

# ------------------------------------------------------------
# 首屏
# ------------------------------------------------------------
hero:
  badge: "新乡洹拓科技有限公司"
  title: "让大模型<br><em>真正落到产线上</em>"
  subtitle: "我们从企业自己的数据和业务流程出发，做大模型应用研发、工业场景 AI 落地、软件与 SaaS 系统开发、云服务部署运维，以及面向 AI 搜索的 GEO 优化。"
  buttons:
    - { name: "核心能力", url: "/products/", primary: true }
    - { name: "技术咨询", url: "/contact/" }
  image: "/images/hero.svg"   # 占位插图，建议后续换成产品界面或工业现场实拍

# ------------------------------------------------------------
# 快捷入口
# ------------------------------------------------------------
quicklinks:
  title: "快速通道"
  subtitle: "从需求到交付，一键直达"
  items:
    - { icon: "code", name: "大模型应用", url: "/products/" }
    - { icon: "settings", name: "工业 AI", url: "/products/" }
    - { icon: "search", name: "GEO 优化", url: "/products/" }
    - { icon: "message-circle", name: "技术咨询", url: "/contact/" }

# ------------------------------------------------------------
# 核心业务
# ------------------------------------------------------------
services:
  title: "核心业务"
  subtitle: "从模型到系统，从上线到运营"
  items:
    - { icon: "zap", title: "AI 大模型研发", desc: "模型微调与推理部署、RAG 知识库、Agent 工作流，把大模型接进企业自有系统。", url: "/products/" }
    - { icon: "settings", title: "AI 工业应用", desc: "工业视觉检测、设备数据分析与产线智能体，落到具体工序而非停留在演示。", url: "/products/" }
    - { icon: "monitor", title: "软件开发", desc: "管理后台、小程序与业务系统的定制开发，按实际流程设计功能。", url: "/products/" }
    - { icon: "cloud", title: "云服务", desc: "上云架构、容器化部署与运维托管，保障业务连续与成本可控。", url: "/products/" }
    - { icon: "trending-up", title: "SaaS 产品与运营", desc: "SaaS 平台搭建、内容运营与经营数据看板，从交付走向长期增长。", url: "/products/" }
    - { icon: "search", title: "GEO 生成式引擎优化", desc: "让品牌与产品在 AI 搜索、大模型回答中被检索、被引用、被推荐。", url: "/products/" }

# ------------------------------------------------------------
# 产品与案例（图为占位素材，建议换成真实产品界面或项目截图）
# ------------------------------------------------------------
products:
  title: "产品与方案"
  subtitle: "按企业实际场景组合交付"
  items:
    - { image: "/images/thumb-1.svg", title: "企业知识库与智能问答", desc: "把制度、工艺、售后文档变成可追问的问答与工单助手。", url: "/solutions/enterprise-knowledge-base/", tags: ["大模型", "RAG", "Agent"] }
    - { image: "/images/thumb-2.svg", title: "工业视觉与设备数据平台", desc: "缺陷检测、参数寻优与产线看板，数据回流闭环。", url: "/solutions/industrial-vision-platform/", tags: ["工业 AI", "视觉", "数据"] }
    - { image: "/images/thumb-3.svg", title: "SaaS 系统与 GEO 优化", desc: "业务系统 SaaS 化交付，配套内容运营与 AI 搜索可见性优化。", url: "/solutions/saas-and-geo/", tags: ["SaaS", "云服务", "GEO"] }
  link:
    name: "查看全部"
    url: "/products/"

# ------------------------------------------------------------
# 新闻动态（自动取 source/_posts 下最新文章）
# ------------------------------------------------------------
news:
  title: "技术与行业动态"
  subtitle: "我们对 AI 工程化落地的观察"
  count: 6
  more:
    name: "查看全部"
    url: "/news/"

# ------------------------------------------------------------
# 关于我们（不写成立年份、团队规模、服务客户数等未经你确认的数字）
# ------------------------------------------------------------
about:
  title: "关于我们"
  subtitle: "把 AI 从演示做成生产力"
  image: "/images/about.svg"
  content: |
    <p>新乡洹拓科技有限公司是一家 AI 应用与软件研发公司，注册于河南省新乡市。我们围绕企业自己的数据和业务流程做交付：大模型应用研发、工业场景 AI 落地、软件与 SaaS 系统开发、云服务部署运维，以及面向 AI 搜索的 GEO 优化。</p>
    <ul>
      <li>从场景梳理、方案设计到模型与系统落地，同一批人全程对接</li>
      <li>交付可运行的系统，而不是停在演示的 Demo</li>
      <li>上线后持续运营与优化，让数据回流到下一次迭代</li>
    </ul>
  link:
    name: "了解更多"
    url: "/about/"

# ------------------------------------------------------------
# 行动号召
# ------------------------------------------------------------
cta:
  title: "有一个想用 AI 解决的业务问题？"
  subtitle: "说清场景和数据现状，我们给可落地的方案与报价"
  button:
    name: "联系我们"
    url: "/contact/"

# ------------------------------------------------------------
# 联系我们
# ------------------------------------------------------------
contact:
  title: "联系我们"
  subtitle: "欢迎来电或预约面谈"
  address: "河南省新乡市辉县市金城百货四楼"
  phone: "400-829-9957"
  email: ""                   # 有对公邮箱再填
  hours: "工作日 9:00 - 18:00" # 按实际营业时间改
  wechat: ""                  # 客服微信二维码放 source/images/ 后填地址
  form_action: ""             # 接 Formspree 等表单服务后填，留空不渲染表单
  map: ""                     # 高德/百度地图 iframe 嵌入地址，留空不显示

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  about: "新乡洹拓科技有限公司：AI 大模型研发、工业 AI 应用、软件开发、云服务与 SaaS 运营、GEO 优化。"
  columns:
    - title: "快速导航"
      items:
        - { name: "首页", url: "/" }
        - { name: "关于我们", url: "/about/" }
        - { name: "新闻动态", url: "/news/" }
    - title: "服务支持"
      items:
        - { name: "产品服务", url: "/products/" }
        - { name: "联系我们", url: "/contact/" }
        - { name: "归档", url: "/archives/" }
    # 数组只能按下标替换或追加，这里追加第三列，把机器可读的入口都放到明面上
    - title: "站点信息"
      items:
        - { name: "网站地图 XML", url: "/sitemap.xml" }
        - { name: "RSS 订阅", url: "/atom.xml" }
        - { name: "robots.txt", url: "/robots.txt" }
        - { name: "llms.txt", url: "/llms.txt" }
  copyright: "© 2026 新乡洹拓科技有限公司 · 保留所有权利"
  icp: ""                     # 备案下来后填，如 豫ICP备00000000号
  icp_url: "https://beian.miit.gov.cn/"
  police: ""
  police_url: ""
  show_powered: true

# 页脚社交/快捷图标。Hexo 的数组深合并只能改和追加、删不掉条目，
# 所以这里按下标把主题自带的"作者邮箱 / Telegram / 作者博客"三个链接整体替换掉。
# 有企业邮箱、公众号后再改 url。
social:
  - { icon: "phone", name: "电话咨询 400-829-9957", url: "tel:4008299957" }
  - { icon: "map-pin", name: "公司地址：辉县市金城百货四楼", url: "/contact/" }
  - { icon: "message-circle", name: "技术咨询与合作洽谈", url: "/contact/" }

# ------------------------------------------------------------
# SEO
# ------------------------------------------------------------
seo:
  description: "新乡洹拓科技有限公司：AI 大模型应用研发、工业 AI 与视觉检测、软件与 SaaS 系统开发、云服务部署运维、GEO 生成式引擎优化。"
  keywords: "新乡洹拓科技,AI大模型应用,企业知识库RAG,工业视觉检测,AI工业应用,新乡软件开发,SaaS系统开发,云服务运维,GEO优化,生成式引擎优化"
  jsonld: true

# ------------------------------------------------------------
# 统计（填了 ID 才会注入，留空 = 产出里不带任何第三方脚本）
#   umami   ：Umami Cloud 后台 Settings → Website → 复制 Website Id（一串 UUID）
#             看板支持手机浏览器，还能开公开分享链接免登录查看
#   clarity ：Microsoft Clarity 后台 Settings → Add project → Project ID（如 m7a9b2x1k3）
#             负责热图与会话录屏，回答"访客在页面上到底做了什么"
#   google / cloudflare 是主题自带的槽位，境内 GA4 看板打不开，一般用不上
#   Vercel Web Analytics 已在平台侧开启，由 scripts/vercel-analytics.js 注入，不在这填
# ------------------------------------------------------------
analytics:
  google: ""
  cloudflare: ""
  umami: ""
  umami_server: "https://cloud.umami.is"   # 注册时选了欧洲区就改成 https://eu.umami.is
  clarity: ""
