# ============================================================
#  站点级主题配置覆盖（Hexo 会与主题默认配置深度合并）
#  只在这里写你要改的键；升级主题不会丢这份配置
#  完整可覆盖项见 themes/hexo-theme-xongyi/_config.yml
# ============================================================

preset: enterprise          # enterprise 商务蓝 / government 政务红 / education 学院青

# ------------------------------------------------------------
# 品牌
# ------------------------------------------------------------
brand:
  name: "新乡洹拓科技"
  slogan: "本地商户数字化服务"
  logo: ""                  # 主题自带 logo.svg 里写着 "Xongyi"，先只显示文字；做好自己的 logo 放到 source/images/ 后填 /images/logo-huantor.svg
  favicon: "/images/favicon.svg"

# ------------------------------------------------------------
# 导航
# ------------------------------------------------------------
menu:
  - { name: "首页", url: "/" }
  - { name: "关于我们", url: "/about/" }
  - { name: "产品服务", url: "/products/" }
  - { name: "新闻动态", url: "/news/" }
  - { name: "联系我们", url: "/contact/" }

nav_button:
  name: "商户咨询"
  url: "/contact/"

# ------------------------------------------------------------
# 首页板块开关
# 注意：Hexo 对配置里的数组是"按下标深合并"，在覆盖文件里重写 sections
# 只能改内容和追加，删不掉主题默认的条目。要隐藏板块请用 enable: false
# （主题 index.ejs 里 conf.enable === false 会跳过该板块）。
# stats 数据、team 团队、partners 伙伴、gallery 图库需要真实数字和照片，先关掉。
# 生效顺序：hero → quicklinks → services → products → news → cta → about-contact
# ------------------------------------------------------------
stats:
  enable: false

team:
  enable: false

partners:
  enable: false

gallery:
  enable: false

# ------------------------------------------------------------
# 首屏
# ------------------------------------------------------------
hero:
  badge: "新乡洹拓科技有限公司"
  title: "让本地商户<br><em>收款更省心</em>"
  subtitle: "立足辉县、服务新乡全域，把收款设备布放、支付渠道接入与软件系统开发放在同一条服务链上，本地团队直营、上门响应。"
  buttons:
    - { name: "了解我们", url: "/about/", primary: true }
    - { name: "业务咨询", url: "/contact/" }
  image: "/images/hero.svg"   # 占位插图，建议后续换成门店实拍

# ------------------------------------------------------------
# 快捷入口
# ------------------------------------------------------------
quicklinks:
  title: "快速通道"
  subtitle: "常用入口一键直达"
  items:
    - { icon: "phone", name: "商户咨询", url: "/contact/" }
    - { icon: "zap", name: "业务介绍", url: "/products/" }
    - { icon: "file-text", name: "新闻动态", url: "/news/" }
    - { icon: "message-circle", name: "合作洽谈", url: "/contact/" }

# ------------------------------------------------------------
# 核心业务
# ------------------------------------------------------------
services:
  title: "核心业务"
  subtitle: "从一台设备到一套系统，本地团队一站对接"
  items:
    - { icon: "zap", title: "收款设备布放", desc: "支付宝「碰一下」等收款设备的选型、布放与现场调试。", url: "/products/" }
    - { icon: "monitor", title: "聚合支付接入", desc: "为门店接入多种收款方式，统一对账，降低收银改造成本。", url: "/products/" }
    - { icon: "code", title: "软件开发", desc: "小程序、管理后台与业务系统的定制开发与迭代维护。", url: "/products/" }
    - { icon: "chart", title: "技术服务与咨询", desc: "技术方案、系统集成与信息技术咨询，覆盖上线前后全流程。", url: "/products/" }
    - { icon: "shield-check", title: "商户运营支持", desc: "设备巡检、故障处理与门店使用培训，保障日常经营不中断。", url: "/products/" }
    - { icon: "users", title: "本地化直营", desc: "需求沟通、现场实施、售后维护都在新乡，不外包、不转手。", url: "/contact/" }

# ------------------------------------------------------------
# 产品与案例（图为占位素材，建议换成真实项目截图）
# ------------------------------------------------------------
products:
  title: "产品与案例"
  subtitle: "按门店实际经营场景组合交付"
  items:
    - { image: "/images/thumb-1.svg", title: "门店收款改造", desc: "从设备选型到收银动线的一站式改造方案。", url: "/products/", tags: ["收单", "门店"] }
    - { image: "/images/thumb-2.svg", title: "小程序与线上商城", desc: "商品展示、线上下单与会员运营。", url: "/products/", tags: ["小程序", "互联网销售"] }
    - { image: "/images/thumb-3.svg", title: "业务管理系统定制", desc: "按流程定制的后台管理与经营数据看板。", url: "/products/", tags: ["软件开发", "数据"] }
  link:
    name: "查看全部"
    url: "/products/"

# ------------------------------------------------------------
# 新闻动态（自动取 source/_posts 下最新文章）
# ------------------------------------------------------------
news:
  title: "新闻动态"
  subtitle: "了解我们的最新进展"
  count: 3
  more:
    name: "查看全部"
    url: "/news/"

# ------------------------------------------------------------
# 关于我们（不写成立年份、商户数等未经你确认的数字）
# ------------------------------------------------------------
about:
  title: "关于我们"
  subtitle: "扎根辉县的本地数字化服务商"
  image: "/images/about.svg"
  content: |
    <p>新乡洹拓科技有限公司注册于河南省新乡市辉县市，是一家面向本地商户与机构的科技服务公司。我们把线下收款设备的选型布放、支付渠道接入和软件系统开发放在同一条服务链上，让商户不必在多个供应商之间来回协调。</p>
    <ul>
      <li>本地团队直营，需求沟通与现场实施都在新乡完成</li>
      <li>方案设计、设备布放、上线维护，全程同一批人对接</li>
      <li>业务覆盖收款改造、软件开发与信息技术咨询</li>
    </ul>
  link:
    name: "了解更多"
    url: "/about/"

# ------------------------------------------------------------
# 行动号召
# ------------------------------------------------------------
cta:
  title: "有门店收款或系统开发的需求？"
  subtitle: "致电 400-829-9957，或到金城百货四楼当面聊"
  button:
    name: "联系我们"
    url: "/contact/"

# ------------------------------------------------------------
# 联系我们
# ------------------------------------------------------------
contact:
  title: "联系我们"
  subtitle: "欢迎来电或到店洽谈"
  address: "河南省新乡市辉县市金城百货四楼"
  phone: "400-829-9957"
  email: ""                   # 有对公邮箱再填
  hours: "工作日 9:00 - 18:00" # 按实际营业时间改
  wechat: ""                  # 客服微信二维码放 source/images/ 后填地址
  form_action: ""             # 接 Formspree 等表单服务后填，留空不渲染表单
  map: ""                     # 高德/百度地图 iframe 嵌入地址，留空不显示

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  about: "新乡洹拓科技有限公司：本地商户收款设备布放、支付渠道接入与软件开发服务。"
  columns:
    - title: "快速导航"
      items:
        - { name: "首页", url: "/" }
        - { name: "关于我们", url: "/about/" }
        - { name: "新闻动态", url: "/news/" }
    - title: "服务支持"
      items:
        - { name: "产品服务", url: "/products/" }
        - { name: "联系我们", url: "/contact/" }
        - { name: "归档", url: "/archives/" }
  copyright: "© 2026 新乡洹拓科技有限公司 · 保留所有权利"
  icp: ""                     # 备案下来后填，如 豫ICP备00000000号
  icp_url: "https://beian.miit.gov.cn/"
  police: ""
  police_url: ""
  show_powered: true

# 页脚社交/快捷图标。Hexo 的数组深合并只能改和追加、删不掉条目，
# 所以这里按下标把主题自带的"作者邮箱 / Telegram / 作者博客"三个链接整体替换掉。
# 有企业邮箱、公众号、企业微信二维码后再改 url。
social:
  - { icon: "phone", name: "电话咨询 400-829-9957", url: "tel:4008299957" }
  - { icon: "map-pin", name: "到店洽谈：辉县市金城百货四楼", url: "/contact/" }
  - { icon: "message-circle", name: "业务咨询与合作洽谈", url: "/contact/" }

# ------------------------------------------------------------
# SEO
# ------------------------------------------------------------
seo:
  description: "新乡洹拓科技有限公司位于河南省新乡市辉县市，为本地商户提供收款设备布放、支付渠道接入、小程序与软件开发、信息技术咨询等服务。"
  keywords: "新乡洹拓科技,辉县市洹拓科技,碰一下收款,支付宝收款设备,聚合支付,商户收单,新乡软件开发,新乡小程序开发"
  jsonld: true

# ------------------------------------------------------------
# 统计（有站点分析再填 ID）
# ------------------------------------------------------------
analytics:
  google: ""
  cloudflare: ""
